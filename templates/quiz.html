<!DOCTYPE html>
<html>
<head>
    <title>Take Quiz</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    <style>
        .quiz-list { margin-top: 20px; }
        .quiz-btn-card { border: 1px solid #ddd; padding: 15px; margin-bottom: 15px; border-radius: 5px; cursor: pointer; transition: 0.3s; }
        .quiz-btn-card:hover { background: #f0f0f0; }
        .question-card { border-left: 4px solid #007bff; padding: 15px; margin: 15px 0; background: #f9f9f9; }
        .option-label { display: block; margin: 10px 0; }
    </style>
</head>
<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg navbar-light bg-light mb-3">
            <div class="container-fluid">
                <a class="navbar-brand">Take Quiz</a>
                <div class="d-flex">
                    <div class="dropdown">
                        <a class="btn btn-secondary dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown">
                            {{ student.name if student else user }}
                        </a>
                        <ul class="dropdown-menu dropdown-menu-end p-2">
                            <li class="dropdown-item-text"><strong>{{ student.name if student else 'N/A' }}</strong></li>
                            <li class="dropdown-item-text">{{ student.email if student else 'N/A' }}</li>
                            <li class="dropdown-item-text">Roll: {{ student.roll_number if student else 'N/A' }}</li>
                            <li><hr class="dropdown-divider"></li>
                            <li><a class="dropdown-item" href="{{ url_for('student_dashboard') }}">Dashboard</a></li>
                            <li><a class="dropdown-item" href="{{ url_for('logout') }}">Logout</a></li>
                        </ul>
                    </div>
                </div>
            </div>
        </nav>

        <div class="content">
            <!-- Available Quizzes Section -->
            <div class="section student-section" id="quiz-list-section">
                <h3>Available Quizzes</h3>
                <div id="quiz-list" class="quiz-list">
                    <!-- Quizzes will be loaded here -->
                    Loading quizzes...
                </div>
            </div>

            <!-- Quiz Taking Section (hidden initially) -->
            <div class="section student-section" id="quiz-taking-section" style="display:none;">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 id="current-quiz-title"></h3>
                    <button class="btn btn-secondary" id="back-to-list-btn">Back to List</button>
                </div>
                <p class="text-muted">Subject: <span id="current-quiz-subject"></span> | Total Marks: <span id="current-quiz-marks"></span></p>
                
                <form id="quiz-form">
                    <div id="questions-container">
                        <!-- Questions will be loaded here -->
                    </div>
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary btn-lg">Submit Quiz</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script>
        let currentQuizId = null;
        let currentQuestions = [];

        async function loadQuizzes() {
            try {
                const response = await fetch('/api/student/quizzes');
                const quizzes = await response.json();

                const quizListDiv = document.getElementById('quiz-list');
                if (!quizzes || quizzes.length === 0) {
                    quizListDiv.innerHTML = '<p class="no-data">No quizzes available yet.</p>';
                    return;
                }

                quizListDiv.innerHTML = quizzes.map(q => `
                    <div class="quiz-btn-card" onclick="startQuiz(${q.quiz_id})">
                        <h5>${q.title}</h5>
                        <p class="text-muted mb-1">Subject: ${q.subject}</p>
                        <p class="text-muted mb-0">Questions: ${q.total_questions || 0} | Total Marks: ${q.total_marks || 0}</p>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Error loading quizzes:', error);
                document.getElementById('quiz-list').innerHTML = '<p class="text-danger">Error loading quizzes</p>';
            }
        }

        async function startQuiz(quizId) {
            try {
                currentQuizId = quizId;
                const response = await fetch(`/api/student/quiz/${quizId}`);
                const data = await response.json();

                document.getElementById('current-quiz-title').textContent = data.title;
                document.getElementById('current-quiz-subject').textContent = data.subject;
                document.getElementById('current-quiz-marks').textContent = data.total_marks || 0;

                currentQuestions = data.questions || [];

                const container = document.getElementById('questions-container');
                if (currentQuestions.length === 0) {
                    container.innerHTML = '<p class="text-danger">No questions in this quiz yet.</p>';
                } else {
                    container.innerHTML = currentQuestions.map((q, idx) => {
                        if (q.question_type === 'multiple_choice') {
                            const options = (q.options || '').split('\n').filter(o => o.trim());
                            return `
                                <div class="question-card">
                                    <strong>Q${idx + 1} (${q.marks} marks): ${q.question_text}</strong>
                                    <div class="mt-2">
                                        ${options.map((option, optIdx) => `
                                            <label class="option-label">
                                                <input type="radio" name="q${q.question_id}" value="${option}" required />
                                                ${option}
                                            </label>
                                        `).join('')}
                                    </div>
                                </div>
                            `;
                        } else {
                            return `
                                <div class="question-card">
                                    <label><strong>Q${idx + 1} (${q.marks} marks): ${q.question_text}</strong></label>
                                    <textarea name="q${q.question_id}" class="form-control" rows="3" required></textarea>
                                </div>
                            `;
                        }
                    }).join('');
                }

                document.getElementById('quiz-list-section').style.display = 'none';
                document.getElementById('quiz-taking-section').style.display = 'block';
            } catch (error) {
                console.error('Error starting quiz:', error);
                alert('Error loading quiz');
            }
        }

        function backToList() {
            document.getElementById('quiz-list-section').style.display = 'block';
            document.getElementById('quiz-taking-section').style.display = 'none';
            currentQuizId = null;
            currentQuestions = [];
        }

        document.getElementById('back-to-list-btn').addEventListener('click', backToList);

        document.getElementById('quiz-form').addEventListener('submit', async (e) => {
            e.preventDefault();

            if (!currentQuizId || currentQuestions.length === 0) {
                alert('No quiz loaded');
                return;
            }

            const answers = {};
            currentQuestions.forEach(q => {
                const name = `q${q.question_id}`;
                const input = document.querySelector(`[name="${name}"]`);
                if (input) {
                    if (input.type === 'radio') {
                        const checked = document.querySelector(`[name="${name}"]:checked`);
                        answers[q.question_id] = checked ? checked.value : '';
                    } else {
                        answers[q.question_id] = input.value;
                    }
                }
            });

            try {
                const response = await fetch('/api/student/quiz/submit', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        quiz_id: currentQuizId,
                        answers: answers
                    })
                });

                const data = await response.json();
                if (response.ok) {
                    alert(`Quiz submitted! Your score: ${data.score}/${data.total_marks}`);
                    backToList();
                    loadQuizzes();
                } else {
                    alert(data.error || 'Failed to submit quiz');
                }
            } catch (error) {
                console.error('Error:', error);
                alert('Error submitting quiz');
            }
        });

        // Load quizzes on page load
        loadQuizzes();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
